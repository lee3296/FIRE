experiment:
  name: fire_pilot
  method: fire
runtime:
  device: cuda
model:
  name_or_path: Qwen/Qwen2.5-1.5B-Instruct
  short_name: qwen2p5_1p5b
  dtype: bfloat16
  load_in_4bit: false
  gradient_checkpointing: true
  trust_remote_code: false
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
ema:
  alpha: 0.01
sequence:
  max_context_tokens: 2560
  max_prompt_tokens: 1280
  max_feedback_tokens: 768
  max_new_tokens: 384
context:
  type: sdpo_feedback
  num_blocks: 4
  order_mode: native
  native_field_order:
  - verifier_result
  - parser_record
  - verifier_provenance
  - response_format
  demo_selection: deterministic
fire:
  eps: 1.0e-08
  weighting: excess_l2_energy
  step_normalized: false
  project_correct_sft: false
correctness_routing:
  enabled: false
  correct_action: skip
  incorrect_action: distill
  normalize_over_eligible: true
routing:
  candidate_chunk_blocks: 2
generation:
  max_new_tokens: 384
  temperature: 0.8
  top_p: 0.95
data:
  adapter: gsm8k
  train_split: train
  eval_split: test
  train_limit: 1024
  eval_limit: 256
train:
  seed: 0
  max_steps: 200
  micro_batch_size: 8
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  log_every: 1
optimizer:
  lr: 4.0e-06
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  schedule: cosine
  warmup_steps: 25
  nominal_lr: 4.0e-06
loss:
  mode: full
  student_top_k: 64
  target_top_k: 128
eval:
  at_start: true
  batch_size: 8
  every_steps: 25
  task_examples: 192
  routing_examples: 32
output:
  root: outputs
  save_checkpoints: false
